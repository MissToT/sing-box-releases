name: Build sing-box testing

on:
  workflow_dispatch:
    inputs:
      # ---- 必填 / 每次都会填 ----
      version:
        description: '版本号或从 commit hash 构建时的临时标签 (例如 1.13.0-rc.4)'
        required: true
      commit_hash:
        description: '可选的 commit hash，指定后将覆盖 version 版本标签'
        required: false
        default: ''

      # ---- 编译内容与产物开关（常用）----
      custom_tags:
        description: '自定义编译 tags，使用英文逗号分隔。留空则使用默认 tags(默认不含 with_ebpf/with_naive_outbound，除非下方开关开启)'
        required: false
        default: ''
      enable_naive_outbound:
        description: '是否启用 with_naive_outbound 标签（仅对 naive 变体构建生效）'
        required: false
        type: boolean
        default: false
      enable_ebpf:
        description: '是否启用 with_ebpf 标签（仅限 Linux/Android 平台）'
        required: false
        type: boolean
        default: false
      enable_upx:
        description: '是否额外产出 UPX 压缩后的核心（独立的 -upx<版本> artifact，不影响原核心产物）'
        required: false
        type: boolean
        default: false

      # ---- 高级选项（基本不用动）----
      go_version:
        description: '自定义 Go 版本（留空使用默认 1.26.8）'
        required: false
        default: ''
      source_repository:
        description: '拉取源码的仓库（owner/repo 或完整仓库 URL），留空使用默认 MissToT/sing-box。私有仓库需配置 Secrets：SING_BOX_REPOSITORY_TOKEN'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

env:
  GO_VERSION: ${{ inputs.go_version != '' && inputs.go_version || '1.26.8' }}
  UPX_OPTIONS: '--best'

permissions:
  contents: read

jobs:
  resolve_source:
    name: Resolve build inputs
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_repository: ${{ steps.source_repo.outputs.repository }}
      use_token: ${{ steps.source_repo.outputs.use_token }}
      upx_tag: ${{ steps.upx.outputs.tag }}
      upx_version: ${{ steps.upx.outputs.version }}
    steps:
      - name: Resolve source repository
        id: source_repo
        shell: bash
        env:
          INPUT_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          DEFAULT_SOURCE_REPOSITORY: MissToT/sing-box
          SOURCE_REPOSITORY_TOKEN: ${{ secrets.SING_BOX_REPOSITORY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail

          source_repository="${INPUT_SOURCE_REPOSITORY:-$DEFAULT_SOURCE_REPOSITORY}"
          source_repository="${source_repository#https://}"
          source_repository="${source_repository#http://}"
          source_repository="${source_repository#git@}"
          source_repository="${source_repository#github.com/}"
          source_repository="${source_repository#github.com:}"
          source_repository="${source_repository%.git}"
          source_repository="${source_repository%/}"

          if [[ ! "$source_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "源码仓库格式无效，应填 owner/repo" >&2
            echo "不要把 token 或用户名密码写在仓库地址里，私有仓库的凭据请配置到 Secrets: SING_BOX_REPOSITORY_TOKEN" >&2
            exit 1
          fi

          probe() {
            timeout 60 git ls-remote --exit-code "$1" >/dev/null 2>&1
          }

          default_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${source_repository}.git"
          secret_url="https://x-access-token:${SOURCE_REPOSITORY_TOKEN}@github.com/${source_repository}.git"

          if [[ -n "$SOURCE_REPOSITORY_TOKEN" ]] && probe "$secret_url"; then
            use_token=true
          elif probe "$default_url"; then
            use_token=false
            if [[ -n "$SOURCE_REPOSITORY_TOKEN" ]]; then
              echo "SING_BOX_REPOSITORY_TOKEN 无法访问 ${source_repository}，改用当前仓库凭据" >&2
            fi
          else
            echo "无法访问源码仓库 ${source_repository}" >&2
            if [[ -n "$SOURCE_REPOSITORY_TOKEN" ]]; then
              echo "请确认 SING_BOX_REPOSITORY_TOKEN 有效并具备该仓库读取权限" >&2
            else
              echo "私有仓库请在仓库 Secrets 中配置具备读取权限的 SING_BOX_REPOSITORY_TOKEN" >&2
            fi
            exit 1
          fi

          echo "repository=${source_repository}" >> "$GITHUB_OUTPUT"
          echo "use_token=${use_token}" >> "$GITHUB_OUTPUT"
          echo "Resolved source repository: ${source_repository} (use_token=${use_token})"

      - name: Checkout sing-box
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source_repo.outputs.repository }}
          ref: ${{ inputs.commit_hash != '' && inputs.commit_hash || format('v{0}', inputs.version) }}
          token: ${{ steps.source_repo.outputs.use_token == 'true' && secrets.SING_BOX_REPOSITORY_TOKEN || github.token }}
          path: sing-box
          fetch-depth: 1

      - name: Resolve source commit
        id: source
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]; then
            echo "invalid version: $INPUT_VERSION" >&2
            exit 1
          fi
          source_sha=$(git -C sing-box rev-parse HEAD)
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "Resolved sing-box source: ${source_sha}"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Resolve latest UPX release
        if: inputs.enable_upx
        id: upx
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_json="$(gh api repos/upx/upx/releases/latest 2>/dev/null || curl -fsSL https://api.github.com/repos/upx/upx/releases/latest || true)"
          if [[ -z "$release_json" ]]; then
            echo "无法获取 UPX 最新版本信息" >&2
            exit 1
          fi

          tag=$(jq -r '.tag_name' <<< "$release_json")
          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "无法解析 UPX 版本号: ${tag}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved UPX: ${tag}"

  build_cli:
    name: Build CLI ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: resolve_source
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: amd64v3
            os: windows-latest
            goos: windows
            goarch: amd64
            goamd64: v3
            binary: sing-box.exe
            variant: purego
            naive: true
          - platform: android
            arch: arm64
            os: ubuntu-26.04
            goos: android
            goarch: arm64
            goamd64: ''
            binary: sing-box
            cgo: '1'
            cc_triple: 'aarch64-linux-android23'
            naive: true
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.resolve_source.outputs.source_repository }}
          ref: ${{ needs.resolve_source.outputs.source_sha }}
          token: ${{ needs.resolve_source.outputs.use_token == 'true' && secrets.SING_BOX_REPOSITORY_TOKEN || github.token }}
          path: sing-box
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: sing-box/go.sum

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set build tag
        shell: bash
        run: |
          set -xeuo pipefail
          cd sing-box
          TAG="v${{ github.event.inputs.version }}"
          git tag -f "${TAG}" "${{ needs.resolve_source.outputs.source_sha }}"

      - name: Compute build environment
        id: env
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            DEFAULT_TAGS=$(cat sing-box/release/DEFAULT_BUILD_TAGS_WINDOWS)
          elif [[ "${{ matrix.naive }}" == "true" ]]; then
            DEFAULT_TAGS=$(cat sing-box/release/DEFAULT_BUILD_TAGS)
          else
            DEFAULT_TAGS=$(cat sing-box/release/DEFAULT_BUILD_TAGS_OTHERS)
          fi

          if [[ -n "${{ github.event.inputs.custom_tags }}" ]]; then
            TAGS="${{ github.event.inputs.custom_tags }}"
          else
            TAGS="${DEFAULT_TAGS}"
          fi

          if [[ "${{ github.event.inputs.enable_naive_outbound }}" == "true" && "${{ matrix.naive }}" == "true" && "${TAGS}" != *with_naive_outbound* ]]; then
            TAGS="${TAGS},with_naive_outbound"
          fi
          if [[ "${{ github.event.inputs.enable_ebpf }}" == "true" && -f sing-box/include/ebpf.go && ("${{ matrix.platform }}" == "linux" || "${{ matrix.platform }}" == "android") && "${TAGS}" != *with_ebpf* ]]; then
            TAGS="${TAGS},with_ebpf"
          fi

          SHORT_SHA="${{ needs.resolve_source.outputs.source_sha }}"
          echo "short_sha=${SHORT_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "ldflags=$(cat sing-box/release/LDFLAGS)" >> "$GITHUB_OUTPUT"

          UPX_VERSION="${{ needs.resolve_source.outputs.upx_version }}"

          echo "--- Build Environment ---"
          echo "Platform: ${{ matrix.platform }}"
          echo "Arch: ${{ matrix.arch }}"
          echo "Tags: ${TAGS}"
          echo "UPX: ${UPX_VERSION:-disabled}"

      - name: Build
        shell: bash
        run: |
          set -xeuo pipefail
          cd sing-box
          mkdir -p dist
          if [[ -n "${{ matrix.cc_triple }}" ]]; then
            export CC="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc_triple }}-clang"
          fi
          go build -v -trimpath -o "dist/${{ matrix.binary }}" \
            -tags "${{ steps.env.outputs.tags }}" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.version }} ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box
        env:
          LDFLAGS_SHARED: ${{ steps.env.outputs.ldflags }}
          CGO_ENABLED: ${{ matrix.cgo || '0' }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}

      - name: Extract libcronet.dll
        if: matrix.variant == 'purego' && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $CRONET_GO_VERSION = Get-Content sing-box/.github/CRONET_GO_VERSION
          $LIBRARY_PATH = "lib/windows_${{ matrix.goarch }}/libcronet.dll"
          git init "$env:RUNNER_TEMP/cronet-go-lib"
          git -C "$env:RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "$env:RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIBRARY_PATH"
          git -C "$env:RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C "$env:RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
          Copy-Item "$env:RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" sing-box/dist

      # ===== 原核心产物 =====
      # artifact 名：sing-box-<版本>-<短sha>-<平台>-<架构>
      # 包内：同名的 .zip / .tar.gz，压缩包里的文件名保持原样（sing-box.exe / LICENSE / libcronet.dll）
      # 不受 UPX 开关影响；这里用 Copy 而不是 Move，因为后面的 UPX 压缩还要用到未压缩的核心
      - name: Stage core artifacts (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd sing-box/dist
          $DIR_NAME = "sing-box-${{ github.event.inputs.version }}-${{ steps.env.outputs.short_sha }}-windows-${{ matrix.arch }}"

          if (-not (Test-Path sing-box.exe)) { throw "未找到构建产物 sing-box.exe" }
          New-Item -ItemType Directory -Force -Path $DIR_NAME | Out-Null
          Copy-Item ../LICENSE "$DIR_NAME/"
          Copy-Item sing-box.exe "$DIR_NAME/"
          if (Test-Path libcronet.dll) { Copy-Item libcronet.dll "$DIR_NAME/" }
          Compress-Archive -Path "$DIR_NAME" -DestinationPath "$DIR_NAME.zip"
          Remove-Item -Recurse "$DIR_NAME"

          New-Item -ItemType Directory -Force -Path core | Out-Null
          Move-Item "$DIR_NAME.zip" core/

          Write-Host "--- core ---"
          Get-ChildItem -File core | Select-Object Name, Length | Format-Table -AutoSize

      - name: Stage core artifacts (Android)
        if: matrix.platform == 'android'
        run: |
          set -xeuo pipefail
          cd sing-box/dist
          DIR_NAME="sing-box-${{ github.event.inputs.version }}-${{ steps.env.outputs.short_sha }}-android-${{ matrix.arch }}"

          [[ -f sing-box ]] || { echo "未找到构建产物 sing-box" >&2; exit 1; }
          mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME/"
          cp sing-box "$DIR_NAME/"
          tar -czvf "$DIR_NAME.tar.gz" "$DIR_NAME"
          rm -rf "$DIR_NAME"

          mkdir -p core
          mv "$DIR_NAME.tar.gz" core/

          echo "--- core ---"
          ls -lh core

      # 核心产物在 build_cli 里就上传完，UPX 由后面的 build_upx job 单独处理，
      # 所以核心包不用等 UPX 压缩（--best 很慢），可以先下载
      - name: Upload core artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-${{ github.event.inputs.version }}-${{ steps.env.outputs.short_sha }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: sing-box/dist/core/*

  # UPX 是独立的一层 job：build_cli 跑完并上传核心产物之后才开始，
  # 直接复用核心产物里的二进制来压缩，不重新编译（省一半 CI 时间，也保证压的就是核心包里的那个二进制）
  build_upx:
    name: Build UPX ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: [resolve_source, build_cli]
    if: ${{ inputs.enable_upx && needs.build_cli.result == 'success' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: amd64v3
            os: windows-latest
            upx_asset: win64.zip
          - platform: android
            arch: arm64
            os: ubuntu-26.04
            upx_asset: amd64_linux.tar.xz
    steps:
      - name: Resolve core artifact name
        id: core
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve_source.outputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:7}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "artifact=sing-box-${VERSION}-${short_sha}-${{ matrix.platform }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          echo "Resolved core artifact: sing-box-${VERSION}-${short_sha}-${{ matrix.platform }}-${{ matrix.arch }}"

      - name: Download core artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.core.outputs.artifact }}
          path: core-artifact

      - name: Extract core binary (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ARTIFACT = "${{ steps.core.outputs.artifact }}"
          Expand-Archive -LiteralPath "core-artifact/$ARTIFACT.zip" -DestinationPath "core-artifact" -Force

          $SRC = "core-artifact/$ARTIFACT"
          if (-not (Test-Path "$SRC/sing-box.exe")) { throw "核心产物里没有 sing-box.exe" }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "$SRC/sing-box.exe" dist/
          Copy-Item "$SRC/LICENSE" dist/
          if (Test-Path "$SRC/libcronet.dll") { Copy-Item "$SRC/libcronet.dll" dist/ }

          Write-Host "--- 待压缩 ---"
          Get-ChildItem -File dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Extract core binary (Android)
        if: matrix.platform == 'android'
        run: |
          set -xeuo pipefail
          ARTIFACT="${{ steps.core.outputs.artifact }}"
          tar -xzf "core-artifact/$ARTIFACT.tar.gz" -C core-artifact
          [[ -f "core-artifact/$ARTIFACT/sing-box" ]] || { echo "核心产物里没有 sing-box" >&2; exit 1; }

          mkdir -p dist
          cp "core-artifact/$ARTIFACT/sing-box" dist/
          cp "core-artifact/$ARTIFACT/LICENSE" dist/
          chmod +x dist/sing-box

          echo "--- 待压缩 ---"
          ls -lh dist

      - name: Install UPX (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          UPX_TAG: ${{ needs.resolve_source.outputs.upx_tag }}
          UPX_VERSION: ${{ needs.resolve_source.outputs.upx_version }}
          UPX_ASSET: ${{ matrix.upx_asset }}
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/upx-${UPX_VERSION}"
          mkdir -p "$DEST"
          URL="https://github.com/upx/upx/releases/download/${UPX_TAG}/upx-${UPX_VERSION}-${UPX_ASSET}"
          if ! curl -fsSL "$URL" -o "$DEST/$UPX_ASSET"; then
            echo "下载 UPX 失败: ${URL}" >&2
            echo "该版本可用资源:" >&2
            curl -fsSL "https://api.github.com/repos/upx/upx/releases/tags/${UPX_TAG}" | jq -r '.assets[].name' >&2 || true
            exit 1
          fi
          tar -xJf "$DEST/$UPX_ASSET" -C "$DEST"
          UPX_BIN=$(find "$DEST" -type f -name upx | head -n 1)
          if [[ -z "$UPX_BIN" ]]; then
            echo "未在解压结果中找到 upx 可执行文件" >&2
            exit 1
          fi
          echo "$(dirname "$UPX_BIN")" >> "$GITHUB_PATH"
          "$UPX_BIN" --version

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UPX_TAG: ${{ needs.resolve_source.outputs.upx_tag }}
          UPX_VERSION: ${{ needs.resolve_source.outputs.upx_version }}
          UPX_ASSET: ${{ matrix.upx_asset }}
        run: |
          $DEST = Join-Path $env:RUNNER_TEMP "upx-$env:UPX_VERSION"
          New-Item -ItemType Directory -Force -Path $DEST | Out-Null
          $URL = "https://github.com/upx/upx/releases/download/$env:UPX_TAG/upx-$env:UPX_VERSION-$env:UPX_ASSET"
          $ZIP = Join-Path $DEST $env:UPX_ASSET
          try {
              Invoke-WebRequest -Uri $URL -OutFile $ZIP
          } catch {
              Write-Host "下载 UPX 失败: $URL"
              (Invoke-RestMethod -Uri "https://api.github.com/repos/upx/upx/releases/tags/$env:UPX_TAG").assets.name | Write-Host
              throw
          }
          Expand-Archive -LiteralPath $ZIP -DestinationPath $DEST -Force
          $UPX = Get-ChildItem -Path $DEST -Recurse -Filter upx.exe | Select-Object -First 1
          if (-not $UPX) { throw "未在解压结果中找到 upx.exe" }
          Add-Content -Path $env:GITHUB_PATH -Value $UPX.DirectoryName
          & $UPX.FullName --version

      - name: Compress with UPX
        id: upx
        shell: bash
        run: |
          set -xeuo pipefail
          cd dist

          UPX_VERSION="${{ needs.resolve_source.outputs.upx_version }}"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            SRC="sing-box.exe"
            DST="sing-box-upx.exe"
          else
            SRC="sing-box"
            DST="sing-box-upx"
          fi

          UPX_ARGS="${UPX_OPTIONS}"
          UPX_PACKED=true
          cp "$SRC" "$DST"
          # Android 的 Go 二进制是 PIE(ET_DYN)，缺少 DF_1_PIE 标记时需要 --force-pie 才能压缩
          if ! upx ${UPX_ARGS} "$DST"; then
            cp "$SRC" "$DST"
            UPX_ARGS="${UPX_OPTIONS} --force-pie"
            if ! upx ${UPX_ARGS} "$DST"; then
              UPX_PACKED=false
            fi
          fi

          if [[ "$UPX_PACKED" != "true" ]]; then
            # 失败时清掉副本，避免把未压缩或半成品文件当成压缩版发出去
            rm -f "$DST"
            echo "::warning::UPX 压缩失败，${{ matrix.platform }}-${{ matrix.arch }} 不产出 UPX 包（失败原因见上方 upx 输出）"
            echo "upx_suffix=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ORIGINAL_SIZE=$(stat -c '%s' "$SRC")
          PACKED_SIZE=$(stat -c '%s' "$DST")
          RATIO=$(( PACKED_SIZE * 10000 / ORIGINAL_SIZE ))
          RATIO_TEXT="$(( RATIO / 100 )).$(printf '%02d' $(( RATIO % 100 )))%"
          {
            echo "upx: $(upx --version | head -n 1)"
            echo "upx_version: ${UPX_VERSION}"
            echo "command: upx ${UPX_ARGS}"
            echo "source: ${SRC}"
            echo "packed: ${DST}"
            echo "original_size: ${ORIGINAL_SIZE}"
            echo "packed_size: ${PACKED_SIZE}"
            echo "ratio: ${RATIO_TEXT}"
          } > UPX.txt
          cat UPX.txt
          echo "upx_suffix=-upx${UPX_VERSION}" >> "$GITHUB_OUTPUT"

      # ===== UPX 产物（独立 artifact，完全不碰核心产物）=====
      # artifact 名：sing-box-<版本>-<短sha>-<平台>-<架构>-upx<UPX版本>
      # 包内：同名的 .zip / .tar.gz；压缩包里的文件名保持原样，不额外加 -upx
      #       （sing-box.exe / sing-box + UPX.txt + LICENSE），upx 信息由包名和 UPX.txt 承载
      # 注意：Windows 的 libcronet.dll 也必须一起带上（它不参与压缩，但运行时 naive 出站需要），
      #       否则这个包解压出来是个跑不了 naive 的残包
      - name: Stage UPX artifacts (Windows)
        if: matrix.platform == 'windows' && steps.upx.outputs.upx_suffix != ''
        shell: pwsh
        run: |
          cd dist
          $DIR_NAME = "sing-box-${{ inputs.version }}-${{ steps.core.outputs.short_sha }}-windows-${{ matrix.arch }}${{ steps.upx.outputs.upx_suffix }}"

          if (-not (Test-Path sing-box-upx.exe)) { throw "未找到 UPX 压缩产物 sing-box-upx.exe" }
          New-Item -ItemType Directory -Force -Path $DIR_NAME | Out-Null
          Copy-Item LICENSE "$DIR_NAME/"
          Copy-Item sing-box-upx.exe "$DIR_NAME/sing-box.exe"
          if (Test-Path libcronet.dll) { Copy-Item libcronet.dll "$DIR_NAME/" }
          if (Test-Path UPX.txt) { Copy-Item UPX.txt "$DIR_NAME/" }
          Compress-Archive -Path "$DIR_NAME" -DestinationPath "$DIR_NAME.zip"
          Remove-Item -Recurse "$DIR_NAME"

          New-Item -ItemType Directory -Force -Path upx | Out-Null
          Move-Item "$DIR_NAME.zip" upx/

          Write-Host "--- upx ---"
          Get-ChildItem -File upx | Select-Object Name, Length | Format-Table -AutoSize

      - name: Stage UPX artifacts (Android)
        if: matrix.platform == 'android' && steps.upx.outputs.upx_suffix != ''
        run: |
          set -xeuo pipefail
          cd dist
          DIR_NAME="sing-box-${{ inputs.version }}-${{ steps.core.outputs.short_sha }}-android-${{ matrix.arch }}${{ steps.upx.outputs.upx_suffix }}"

          [[ -f sing-box-upx ]] || { echo "未找到 UPX 压缩产物 sing-box-upx" >&2; exit 1; }
          mkdir -p "$DIR_NAME"
          cp LICENSE "$DIR_NAME/"
          cp sing-box-upx "$DIR_NAME/sing-box"
          chmod +x "$DIR_NAME/sing-box"
          if [[ -f UPX.txt ]]; then
            cp UPX.txt "$DIR_NAME/"
          fi
          tar -czvf "$DIR_NAME.tar.gz" "$DIR_NAME"
          rm -rf "$DIR_NAME"

          mkdir -p upx
          mv "$DIR_NAME.tar.gz" upx/

          echo "--- upx ---"
          ls -lh upx

      - name: Upload UPX artifact
        if: steps.upx.outputs.upx_suffix != ''
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-${{ inputs.version }}-${{ steps.core.outputs.short_sha }}-${{ matrix.platform }}-${{ matrix.arch }}${{ steps.upx.outputs.upx_suffix }}
          path: dist/upx/*

  finalize_build:
    name: Finalize build artifacts
    runs-on: ubuntu-latest
    needs: [resolve_source, build_cli, build_upx]
    if: ${{ always() && needs.resolve_source.result == 'success' && needs.build_cli.result == 'success' && (needs.build_upx.result == 'success' || needs.build_upx.result == 'skipped') }}
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sing-box-*
          path: artifacts
          merge-multiple: true

      - name: Generate build manifest
        run: |
          set -euo pipefail
          {
            while IFS= read -r -d '' file; do
              relative_path=${file#artifacts/}
              sha256=$(sha256sum "$file" | awk '{print $1}')
              size=$(stat -c '%s' "$file")
              jq -nc \
                --arg path "$relative_path" \
                --arg sha256 "$sha256" \
                --argjson size "$size" \
                '{path: $path, sha256: $sha256, size: $size}'
            done < <(find artifacts -type f -print0 | sort -z)
          } | jq -s 'sort_by(.path)' > artifact-files.json

          jq -n \
            --arg workflow '.github/workflows/build-testing.yml' \
            --arg repository "${{ github.repository }}" \
            --arg head_branch "${{ github.ref_name }}" \
            --arg head_sha "${{ github.sha }}" \
            --arg version "${{ inputs.version }}" \
            --arg source_repository "${{ needs.resolve_source.outputs.source_repository }}" \
            --arg source_sha "${{ needs.resolve_source.outputs.source_sha }}" \
            --arg upx_version "${{ needs.resolve_source.outputs.upx_version }}" \
            --arg upx_options "$UPX_OPTIONS" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson run_id "${{ github.run_id }}" \
            --argjson run_attempt "${{ github.run_attempt }}" \
            --slurpfile artifact_files artifact-files.json \
            '{
              schema_version: 1,
              workflow: $workflow,
              repository: $repository,
              head_branch: $head_branch,
              head_sha: $head_sha,
              run_id: $run_id,
              run_attempt: $run_attempt,
              version: $version,
              source_repository: $source_repository,
              source_sha: $source_sha,
              built_at: $built_at,
              build: {
                cli: true
              },
              upx: {
                enabled: ($upx_version != ""),
                version: (if $upx_version == "" then null else $upx_version end),
                options: (if $upx_version == "" then null else $upx_options end)
              },
              artifacts: $artifact_files[0]
            }' > build-manifest.json

          jq -e '.artifacts | length > 0' build-manifest.json >/dev/null
          cat build-manifest.json

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            artifacts/**
            build-manifest.json

      - name: Upload build manifest
        uses: actions/upload-artifact@v7
        with:
          name: build-manifest
          path: build-manifest.json

  cache_gc:
    name: Cache GC
    if: always()
    runs-on: ubuntu-latest
    needs: finalize_build
    permissions:
      actions: write
    steps:
      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --paginate \
            --jq '.actions_caches[] | [.id, .ref, .created_at, .last_accessed_at, .size_in_bytes, .key] | @tsv' > "$RUNNER_TEMP/caches.tsv"
          python3 - "$GITHUB_REPOSITORY" "$RUNNER_TEMP/caches.tsv" <<'EOF'
          import re
          import subprocess
          import sys

          repository, list_path = sys.argv[1], sys.argv[2]
          budget = 9 * 1024 * 1024 * 1024
          rows = []
          with open(list_path) as list_file:
              for line in list_file:
                  cache_id, ref, created_at, accessed_at, size, key = line.rstrip("\n").split("\t")
                  family = key
                  while True:
                      stripped = re.sub(r"-[0-9a-f]{16,}$", "", family)
                      if stripped == family:
                          break
                      family = stripped
                  rows.append({
                      "id": cache_id, "ref": ref, "created": created_at,
                      "accessed": accessed_at, "size": int(size), "key": key,
                      "family": family,
                  })
          newest = {}
          for row in rows:
              group = (row["ref"], row["family"])
              if group not in newest or row["created"] > newest[group]["created"]:
                  newest[group] = row
          doomed = [row for row in rows if newest[(row["ref"], row["family"])] is not row]
          kept = [row for row in rows if newest[(row["ref"], row["family"])] is row]
          total = sum(row["size"] for row in kept)
          for row in sorted(kept, key=lambda entry: entry["accessed"]):
              if total <= budget:
                  break
              doomed.append(row)
              total -= row["size"]
          for row in doomed:
              print(f"delete {row['size'] >> 20}MB {row['key']} ({row['ref']})")
              subprocess.run(
                  ["gh", "api", "-X", "DELETE", f"repos/{repository}/actions/caches/{row['id']}"],
                  check=False,
              )
          print(f"kept {len(rows) - len(doomed)} caches, {total >> 20}MB total")
          EOF